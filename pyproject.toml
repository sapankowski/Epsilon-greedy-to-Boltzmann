[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epsilon-greedy-to-boltzmann"
version = "0.1.0"
description = "DQN experiments for switching from epsilon-greedy to Boltzmann exploration."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
    "gymnasium>=1.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
classic = ["gymnasium[classic-control]>=1.0"]
box2d = ["gymnasium[box2d]>=1.0"]
atari = [
    "gymnasium[atari,accept-rom-license]>=1.0",
    "ale-py>=0.10",
    "opencv-python-headless>=4.8",
]
plots = ["matplotlib>=3.8"]
dev = ["pytest>=8.0", "matplotlib>=3.8"]

[project.scripts]
egtb-train = "egtb.train:main"
egtb-plot = "egtb.plot:main"
egtb-analyze = "egtb.analyze:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
